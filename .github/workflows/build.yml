name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: 4. Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: 5. Build Next.js
        run: npm run build

      - name: 6. Inisialisasi Capacitor Android
        run: |
          npx cap init "AplikasiSaya" "com.aistudio.app" --web-dir="out"
          npx cap add android

      - name: 7. Build APK dengan Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 8. Upload Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: Aplikasi-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
